name: Repair question route CloudFormation rollback

on:
  push:
    branches:
      - fix/question-route-stage-dependency

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/question-route-stage-dependency

      - name: Patch CloudFormation dependency and targeted recovery
        run: |
          python <<'PY'
          from pathlib import Path

          template = Path('infra/CD/t01.cf.yaml')
          text = template.read_text()
          old = '''  ScenarioApiStage:\n    Type: AWS::ApiGatewayV2::Stage\n'''
          new = '''  ScenarioApiStage:\n    DependsOn:\n      - QuestionLogRoute\n    Type: AWS::ApiGatewayV2::Stage\n'''
          if old not in text:
              raise SystemExit('ScenarioApiStage block not found')
          template.write_text(text.replace(old, new, 1))

          deploy = Path('infra/CD/deploy-all.ts')
          text = deploy.read_text()
          old_import = '''  ContinueUpdateRollbackCommand,\n  DescribeStacksCommand,\n'''
          new_import = '''  ContinueUpdateRollbackCommand,\n  DescribeStackEventsCommand,\n  DescribeStacksCommand,\n'''
          if old_import not in text:
              raise SystemExit('CloudFormation import block not found')
          text = text.replace(old_import, new_import, 1)

          old_fn = '''async function recoverFailedRollback(name: string, status?: string) {\n  if (status !== 'UPDATE_ROLLBACK_FAILED') return;\n\n  console.log(`Template ${name} is in UPDATE_ROLLBACK_FAILED; continuing rollback before deployment...`);\n  await cf.send(new ContinueUpdateRollbackCommand({ StackName: name }));\n\n  const deadline = Date.now() + (20 * 60 * 1000);\n  while (Date.now() < deadline) {\n    await new Promise(resolve => setTimeout(resolve, 5000));\n    const response = await cf.send(new DescribeStacksCommand({ StackName: name }));\n    const currentStatus = response.Stacks?.[0]?.StackStatus;\n\n    if (currentStatus === 'UPDATE_ROLLBACK_COMPLETE') {\n      console.log(`Template ${name} rollback recovered.`);\n      return;\n    }\n    if (currentStatus === 'UPDATE_ROLLBACK_FAILED') {\n      throw new Error(`Template ${name} rollback failed again; manual resource-level recovery is required.`);\n    }\n    if (currentStatus !== 'UPDATE_ROLLBACK_IN_PROGRESS') {\n      throw new Error(`Template ${name} reached unexpected status ${currentStatus} while recovering rollback.`);\n    }\n  }\n\n  throw new Error(`Timed out waiting for template ${name} rollback recovery.`);\n}\n'''
          new_fn = '''async function recoverFailedRollback(name: string, status?: string) {\n  if (status !== 'UPDATE_ROLLBACK_FAILED') return;\n\n  const events = await cf.send(new DescribeStackEventsCommand({ StackName: name }));\n  const questionRouteStageFailure = events.StackEvents?.some(event =>\n    event.LogicalResourceId === 'ScenarioApiStage'\n      && event.ResourceStatus === 'UPDATE_FAILED'\n      && event.ResourceStatusReason?.includes('POST /api/questions')\n      && event.ResourceStatusReason?.includes('Route')\n  );\n  const resourcesToSkip = questionRouteStageFailure ? ['ScenarioApiStage'] : undefined;\n\n  console.log(`Template ${name} is in UPDATE_ROLLBACK_FAILED; continuing rollback before deployment...`);\n  if (resourcesToSkip) {\n    console.log('Known question-route rollback failure detected; skipping ScenarioApiStage during rollback recovery.');\n  }\n  await cf.send(new ContinueUpdateRollbackCommand({\n    StackName: name,\n    ResourcesToSkip: resourcesToSkip,\n  }));\n\n  const deadline = Date.now() + (20 * 60 * 1000);\n  while (Date.now() < deadline) {\n    await new Promise(resolve => setTimeout(resolve, 5000));\n    const response = await cf.send(new DescribeStacksCommand({ StackName: name }));\n    const currentStatus = response.Stacks?.[0]?.StackStatus;\n\n    if (currentStatus === 'UPDATE_ROLLBACK_COMPLETE') {\n      console.log(`Template ${name} rollback recovered.`);\n      return;\n    }\n    if (currentStatus === 'UPDATE_ROLLBACK_FAILED') {\n      throw new Error(`Template ${name} rollback failed again; manual resource-level recovery is required.`);\n    }\n    if (currentStatus !== 'UPDATE_ROLLBACK_IN_PROGRESS') {\n      throw new Error(`Template ${name} reached unexpected status ${currentStatus} while recovering rollback.`);\n    }\n  }\n\n  throw new Error(`Timed out waiting for template ${name} rollback recovery.`);\n}\n'''
          if old_fn not in text:
              raise SystemExit('recoverFailedRollback function not found')
          deploy.write_text(text.replace(old_fn, new_fn, 1))
          PY

      - name: Commit permanent fix to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add infra/CD/t01.cf.yaml infra/CD/deploy-all.ts
          git commit -m "Fix question route CloudFormation rollback"
          git push origin HEAD:fix/question-route-stage-dependency

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Recover stuck stack
        env:
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          status=$(aws cloudformation describe-stacks --region "$REGION" --stack-name Israel-elections --query 'Stacks[0].StackStatus' --output text)
          echo "Current status: $status"
          if [ "$status" = "UPDATE_ROLLBACK_FAILED" ]; then
            aws cloudformation continue-update-rollback --region "$REGION" --stack-name Israel-elections --resources-to-skip ScenarioApiStage
          fi
          for i in $(seq 1 120); do
            status=$(aws cloudformation describe-stacks --region "$REGION" --stack-name Israel-elections --query 'Stacks[0].StackStatus' --output text)
            echo "Rollback status: $status"
            if [ "$status" = "UPDATE_ROLLBACK_COMPLETE" ]; then
              exit 0
            fi
            if [ "$status" = "UPDATE_ROLLBACK_FAILED" ]; then
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for rollback recovery"
          exit 1
