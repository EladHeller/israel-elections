name: CD
on:
  push:
    branches:
      - master
      - develop
jobs:
  env_detect:
    runs-on: ubuntu-latest
    steps:
      - name: Detect env
        id: branch_check
        run: |
          echo "Running on branch ${{ github.ref }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "env_name=dev" >> $GITHUB_OUTPUT
          fi
      - name: Use variable setup in previous step
        run: echo "I'm using variable ${{ steps.branch_check.outputs.env_name }}"
    outputs:
      env_name: ${{ steps.branch_check.outputs.env_name }}

  deploy:
    needs:
      - env_detect
    environment:
      name: ${{ needs.env_detect.outputs.env_name }}
      url: ${{ needs.env_detect.outputs.env_name == 'dev' && steps.site_url.outputs.url || '' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Cache node modules
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules-v1
        with:
          path: ~/.npm
          key: deploy-cache-node-modules-v1-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build and Deploy
        run: |
          export NODE_ENV=${{ needs.env_detect.outputs.env_name }}
          export REGION=${{ secrets.AWS_REGION }}
          export CODE_BUCKET=${{ secrets.CODE_BUCKET_NAME }}
          export CURR_ELECTIONS=${{ secrets.CURR_ELECTIONS }}
          export CLIENT_CODE_BUCKET=${{ secrets.CLIENT_CODE_BUCKET }}
          export HOSTED_ZONE_ID=${{ secrets.HOSTED_ZONE_ID }}
          export DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
          export SUB_DOMAIN=${{ secrets.SUB_DOMAIN }}
          npm run deploy

      - name: Read deployed site URL
        id: site_url
        run: |
          site_url=$(aws cloudformation describe-stacks \
            --stack-name Israel-elections-code-bucket \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue | [0]" \
            --output text)
          echo "url=$site_url" >> "$GITHUB_OUTPUT"

  publish_prod_url:
    needs: [env_detect, deploy]
    if: needs.env_detect.outputs.env_name == 'prod'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      # Publish after deploy completes so its automatic status cannot overwrite the URL.
      # The public production hostname is also an AWS configuration secret, which
      # makes the Actions runner reject it when used as environment.url.
      - name: Publish production deployment URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=prod&per_page=1" \
            --jq '.[0].id // empty')
          if [ -z "$deployment_id" ]; then
            echo "No production deployment found for $GITHUB_SHA" >&2
            exit 1
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success \
            -f environment_url=https://elections.eladheller.com \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent
