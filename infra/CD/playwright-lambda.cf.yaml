AWSTemplateFormatVersion: 2010-09-09

Parameters:
  ImageUri:
    Type: String
  ClientCodeName:
    Type: String
  CurrentElections:
    Type: String
  Region:
    Type: String
  DistributionId:
    Type: String

Resources:
  PlaywrightLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Join
        - "-"
        - - !Ref Region
          - "israel-elections-playwright-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: Playwright-listener-execution
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - s3:*
                  - cloudfront:*
                Resource: "*"

  PlaywrightLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Israel-elections-playwright-listener
      PackageType: Image
      Role: !GetAtt PlaywrightLambdaRole.Arn
      Code:
        ImageUri: !Ref ImageUri
      Timeout: 360
      MemorySize: 2048
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          CURR_ELECTIONS: !Ref CurrentElections
          BUCKET: !Ref ClientCodeName
          REGION: !Ref Region
          DISTRIBUTION_ID: !Ref DistributionId

Outputs:
  PlaywrightFunctionName:
    Value: !Ref PlaywrightLambda
  PlaywrightFunctionArn:
    Value: !GetAtt PlaywrightLambda.Arn
