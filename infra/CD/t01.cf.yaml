AWSTemplateFormatVersion: 2010-09-09
Parameters:
  BucketCodeName:
    Description: The name of code bucket.
    Type: String
  ClientCodeName:
    Description: The name of client code bucket.
    Type: String
  CurrentElections:
    Description: The number of current elections.
    Type: String
  Region:
    Description: The region that running on.
    Type: String
  DistributionId:
    Description: The distribution id.
    Type: String

Resources:
  IsraelElectionsLambdaIamRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      RoleName: !Join
        - "-"
        - - !Ref Region
          - "israel-elections-lambda-role"
      Policies:
        - PolicyName: Lambda-execution-basic
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "s3:*"
                  - "cloudfront:*"
                Resource: "*"
  IsraelElectionsLambda:
    DependsOn:
      - IsraelElectionsLambdaIamRole
    Type: "AWS::Lambda::Function"
    Properties:
      Role: !GetAtt IsraelElectionsLambdaIamRole.Arn
      FunctionName: Israel-elections-function
      Runtime: nodejs24.x
      Environment:
        Variables:
          CURR_ELECTIONS: !Ref CurrentElections
          BUCKET: !Ref ClientCodeName
          REGION: !Ref Region
          DISTRIBUTION_ID: !Ref DistributionId
      Handler: dist/index.handler
      Timeout: 360
      Code:
        S3Bucket: !Ref BucketCodeName
        S3Key: dist.zip

  IsraelElectionsEventRule:
    DependsOn:
      - IsraelElectionsLambda
    Type: "AWS::Events::Rule"
    Properties:
      Name: Israel-elections-scheduler
      State: DISABLED
      ScheduleExpression: rate(1 minute)
      Targets:
        - Id: Israel-elections-function
          Arn: !GetAtt IsraelElectionsLambda.Arn

  IsraelElectionsInvokePermission:
    DependsOn:
      - IsraelElectionsEventRule
      - IsraelElectionsLambda
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt IsraelElectionsEventRule.Arn
      FunctionName: Israel-elections-function

  SharedScenariosTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  ScenarioShareLambdaIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: Scenario-share-execution
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt SharedScenariosTable.Arn

  ScenarioShareLambda:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt ScenarioShareLambdaIamRole.Arn
      FunctionName: Israel-elections-scenario-share
      Runtime: nodejs24.x
      Handler: dist/scenario-share.handler
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          SCENARIO_TABLE_NAME: !Ref SharedScenariosTable
      Code:
        S3Bucket: !Ref BucketCodeName
        S3Key: dist.zip

  QuestionLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      TableClass: STANDARD
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 2
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: outcome
          AttributeType: S
        - AttributeName: receivedAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-outcome-time
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 2
          KeySchema:
            - AttributeName: outcome
              KeyType: HASH
            - AttributeName: receivedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  QuestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-question-log'
      RetentionInDays: 14

  QuestionLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Write-question-records
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt QuestionLogTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt QuestionLogGroup.Arn

  QuestionLogLambda:
    Type: AWS::Lambda::Function
    Properties:
      Role: !GetAtt QuestionLogRole.Arn
      FunctionName: !Sub '${AWS::StackName}-question-log'
      Runtime: nodejs24.x
      Handler: dist/question-log.handler
      Timeout: 5
      MemorySize: 128
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          QUESTION_LOG_TABLE: !Ref QuestionLogTable
      Code:
        S3Bucket: !Ref BucketCodeName
        S3Key: dist.zip

  QuestionLogIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ScenarioApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt QuestionLogLambda.Arn
      PayloadFormatVersion: "2.0"

  QuestionLogRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ScenarioApi
      RouteKey: "POST /api/questions"
      Target: !Join [/, [integrations, !Ref QuestionLogIntegration]]

  QuestionLogInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref QuestionLogLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ScenarioApi}/*/POST/api/questions'

  ScenarioApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: Israel-elections-scenario-api
      ProtocolType: HTTP

  ScenarioApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ScenarioApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ScenarioShareLambda.Arn
      PayloadFormatVersion: "2.0"

  ScenarioCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ScenarioApi
      RouteKey: "POST /api/scenarios"
      Target: !Join [/, [integrations, !Ref ScenarioApiIntegration]]

  ScenarioGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ScenarioApi
      RouteKey: "GET /api/scenarios/{id}"
      Target: !Join [/, [integrations, !Ref ScenarioApiIntegration]]

  ScenarioShortRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ScenarioApi
      RouteKey: "GET /s/{id}"
      Target: !Join [/, [integrations, !Ref ScenarioApiIntegration]]

  ScenarioApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ScenarioApi
      StageName: $default
      AutoDeploy: true
      RouteSettings:
        "POST /api/questions":
          ThrottlingBurstLimit: 4
          ThrottlingRateLimit: 2
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  ScenarioShareLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ScenarioShareLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ScenarioApi}/*/*/*"

Outputs:
  QuestionLogTableName:
    Description: Private question records, isolated per environment; query by-outcome-time.
    Value: !Ref QuestionLogTable
  QuestionLogFunctionName:
    Description: Question logging Lambda updated by deployment.
    Value: !Ref QuestionLogLambda
  ScenarioApiEndpoint:
    Value: !GetAtt ScenarioApi.ApiEndpoint
