AWSTemplateFormatVersion: '2010-09-09'
Description: Container images for the browser CSV diagnostic.
Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep two recent diagnostic images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":2},"action":{"type":"expire"}}]}
Outputs:
  RepositoryUri:
    Description: ECR repository URI used by the diagnostic build.
    Value: !GetAtt Repository.RepositoryUri
